<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ателье — квитанции</title>
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ателье">
<meta name="theme-color" content="#d82f45">
<style>
:root{--ink:#2b1d22;--c:#e83a55;--c2:#d82f45;--tape:#ffc2cc;--dark:#6b1f33;--paper:#fbf4f5;--card:#fff;--line:#ecd7db;--muted:#7d6a70}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--paper);color:var(--ink)}
h1,h2,.sect{font-family:Georgia,"Times New Roman",serif}
header{background:linear-gradient(100deg,#ff4566,#d82f45);color:#fff;padding:max(12px,env(safe-area-inset-top)) 22px 12px;display:flex;align-items:center;gap:14px}
#logo{height:54px;max-width:150px;object-fit:contain;display:none}
header h1{font-size:22px;margin:0;flex:1;font-weight:700}
#num{background:#fff;color:var(--c2);font-weight:700;font-size:14px;padding:6px 12px;border-radius:4px}
.tape{height:16px;background:repeating-linear-gradient(90deg,var(--c2) 0 1.5px,transparent 1.5px 40px) bottom/100% 14px no-repeat,repeating-linear-gradient(90deg,var(--c2) 0 1px,transparent 1px 8px) bottom/100% 7px no-repeat,#fff;border-bottom:1px solid var(--line)}
main{max-width:860px;margin:0 auto;padding:22px}
h2{font-size:24px;margin:0 0 16px}
.back{background:none;border:0;color:var(--muted);font:inherit;font-size:16px;cursor:pointer;padding:0 0 12px}
.big{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.tile{border:1.5px solid var(--line);border-left:6px solid var(--c);background:var(--card);border-radius:6px;padding:14px 16px;font:inherit;font-size:18px;cursor:pointer;text-align:left;color:var(--ink);min-height:84px;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.tile:hover,.tile:focus-visible{border-color:var(--c);box-shadow:0 0 0 3px var(--tape);outline:none}
.tile i{font-style:normal;font-size:15px;color:var(--muted)}
.rep .tile{border-left-color:var(--dark)}
.sect{min-height:190px;font-size:32px;font-weight:700;color:#fff;border:0;justify-content:flex-end;padding:22px}
.sect small{font-family:"Segoe UI",system-ui,sans-serif;font-size:15px;font-weight:400;opacity:.8;display:block;margin-top:6px}
.sect.a{background:linear-gradient(135deg,#ff4566,#d82f45)}.sect.b{background:linear-gradient(135deg,#8c2340,#5a1a2c)}
.sect:hover,.sect:focus-visible{box-shadow:0 0 0 4px var(--tape)}
form{background:var(--card);padding:22px;border-radius:6px;border:1.5px solid var(--line);display:grid;gap:16px}
.pick{font-size:17px;font-weight:600;padding:10px 14px;background:#fde8eb;border-left:6px solid var(--c)}
label{display:grid;gap:6px;font-size:15px;color:var(--muted)}
input,textarea{font:inherit;font-size:18px;max-width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:6px;color:var(--ink)}
input:focus,textarea:focus{border-color:var(--c);outline:2px solid var(--tape)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.price{display:flex;align-items:center;gap:8px}.price input{flex:1}.price b{font-size:20px}
.btn{font:inherit;font-size:19px;font-weight:700;padding:15px;border:0;border-radius:6px;background:linear-gradient(135deg,#ff4566,#d82f45);color:#fff;cursor:pointer}
.btn:focus-visible{outline:3px solid var(--tape)}
#off{display:none;font-size:13px;background:#fff3;padding:4px 8px;border-radius:4px}
.hidden{display:none!important}
#print{display:none}
@media(max-width:560px){.big,.row{grid-template-columns:1fr}.sect{min-height:130px}}
@media print{
 body{background:#fff;color:#000}header,main,.tape{display:none}
 #print{display:block}
 @page{size:A5 landscape;margin:8mm}
 .rc{font-size:13px;padding:6px 4px;page-break-after:always;border-bottom:1px dashed #000}
 .rc:last-child{page-break-after:auto;border:0}
 .rh{display:flex;align-items:center;gap:12px;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:6px}
 .rh img{height:42px;max-width:120px;object-fit:contain}
 .rh h3{margin:0;font-size:19px;flex:1;font-family:Georgia,serif}
 .rh small{display:block;font-weight:400;font-size:11px;font-family:"Segoe UI",sans-serif}
 .rh span{font-size:15px;font-weight:700;white-space:nowrap}
 .rc table{width:100%;border-collapse:collapse}
 .rc td{padding:5px 4px;border-bottom:1px solid #999;vertical-align:top}
 .rc td:first-child{width:38%;color:#444}
 .rc tr.pr td{font-size:16px;font-weight:700;border-bottom:2px solid #000}
 .rc .sg{margin-top:18px;display:flex;justify-content:space-between}
}
</style></head><body>
<header>
 <img id="logo" src="logo-white.png" alt="" onload="this.style.display='block';window.logoOk=1" onerror="this.remove()">
 <h1 id="shop"></h1><span id="off">без сети</span><span id="num"></span>
</header>
<div class="tape"></div>
<main>
 <section id="s1">
  <h2>Что нужно сделать?</h2>
  <div class="big">
   <button class="tile sect a" data-sec="sew">Пошив<small>новые изделия</small></button>
   <button class="tile sect b" data-sec="rep">Ремонт<small>подгонка и исправление</small></button>
  </div>
 </section>
 <section id="s2" class="hidden">
  <button class="back" data-go="s1">← Назад</button>
  <h2 id="secTitle"></h2>
  <div class="grid" id="services"></div>
 </section>
 <section id="s3" class="hidden">
  <button class="back" data-go="s2">← Назад</button>
  <form id="f">
   <div class="pick" id="pick"></div>
   <label>Имя клиента<input id="name" required autocomplete="off"></label>
   <label>Телефон<input id="phone" type="tel" required placeholder="+7 ___ ___-__-__" autocomplete="off"></label>
   <div class="row">
    <label>Дата приёма<input id="d1" type="date" required></label>
    <label>Предварительная дата готовности<input id="d2" type="date" required></label>
   </div>
   <label>Стоимость<span class="price"><input id="price" type="number" min="0" step="any" inputmode="decimal" required><b class="cur"></b></span></label>
   <label>Примечание (необязательно)<textarea id="note" rows="2"></textarea></label>
   <button class="btn" type="submit">Печать квитанции</button>
  </form>
 </section>
</main>
<div id="print"></div>
<script>
// ===== НАСТРОЙКИ: правьте здесь =====
const SHOP={name:"Ателье",contacts:""};   // название и контакты (адрес, телефон) для квитанции
const CURRENCY="₽";
// [название услуги, цена]. Цену можно менять; null — цена вводится вручную
const SERVICES={
 sew:{title:"Пошив",items:[["Платье",5000],["Юбка",2500],["Брюки",3500],["Рубашка / блузка",3000],["Пиджак / жакет",6000],["Пальто / куртка",9000],["Костюм",10000],["Шторы",null],["Постельное бельё",null],["Другое…",null]]},
 rep:{title:"Ремонт",items:[["Подшив брюк",500],["Подшив юбки / платья",700],["Укоротить рукава",800],["Заменить молнию",600],["Заменить подкладку",1500],["Ушить / расширить по боку",900],["Замена фурнитуры / пуговиц",300],["Штопка / заплатка",400],["Ремонт кожи / меха",null],["Другое…",null]]}
};
// ====================================
const $=id=>document.getElementById(id);
let cur=null;
const lsGet=(k,d)=>{try{return localStorage.getItem(k)||d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const nextNo=()=>+lsGet("atelierNo","1");
const show=id=>["s1","s2","s3"].forEach(s=>$(s).classList.toggle("hidden",s!==id));
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fmt=s=>s.split("-").reverse().join(".");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>Number(n).toLocaleString("ru-RU")+" "+CURRENCY;
$("shop").textContent=SHOP.name;
document.querySelectorAll(".cur").forEach(e=>e.textContent=CURRENCY);
function refreshNo(){$("num").textContent="№ "+nextNo()}
refreshNo();
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>show(b.dataset.go));
document.querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>{
 const key=b.dataset.sec,s=SERVICES[key];cur={sec:s.title};
 $("secTitle").textContent=s.title+": выберите услугу";
 const g=$("services");g.innerHTML="";g.className="grid "+(key==="rep"?"rep":"");
 s.items.forEach(([n,p])=>{const t=document.createElement("button");t.className="tile";
  t.innerHTML="<span>"+esc(n)+"</span><i>"+(p==null?"цена вручную":money(p))+"</i>";
  t.onclick=()=>pickService(n,p);g.appendChild(t)});
 show("s2");
});
function pickService(n,p){
 if(n==="Другое…"){n=prompt("Название услуги:");if(!n)return}
 cur.service=n;$("pick").textContent=cur.sec+" — "+n;
 const t=new Date();$("d1").value=iso(t);t.setDate(t.getDate()+3);$("d2").value=iso(t);
 $("name").value=$("phone").value=$("note").value="";
 $("price").value=p==null?"":p;
 show("s3");$("name").focus();
}
$("f").onsubmit=e=>{
 e.preventDefault();
 const no=nextNo();
 const copy=who=>`<div class="rc"><div class="rh">${window.logoOk?'<img src="logo.png" alt="">':''}
 <h3>${esc(SHOP.name)}<small>${esc(SHOP.contacts)}</small></h3><span>Квитанция № ${no}<small>${who}</small></span></div>
 <table><tr><td>Клиент</td><td>${esc($("name").value)}</td></tr>
 <tr><td>Телефон</td><td>${esc($("phone").value)}</td></tr>
 <tr><td>Вид работ</td><td>${esc(cur.sec)} — ${esc(cur.service)}</td></tr>
 <tr><td>Дата приёма</td><td>${fmt($("d1").value)}</td></tr>
 <tr><td>Предв. дата готовности</td><td>${fmt($("d2").value)}</td></tr>
 ${$("note").value?`<tr><td>Примечание</td><td>${esc($("note").value)}</td></tr>`:""}
 <tr class="pr"><td>Стоимость</td><td>${money($("price").value)}</td></tr></table>
 <div class="sg"><span>Приёмщик: ____________</span><span>Клиент: ____________</span></div></div>`;
 $("print").innerHTML=copy("экземпляр клиента")+copy("экземпляр ателье");
 lsSet("atelierNo",no+1);
 window.print();
 refreshNo();show("s1");
};
// ===== офлайн-режим =====
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
const net=()=>{$("off").style.display=navigator.onLine?"none":"inline"};
addEventListener("online",net);addEventListener("offline",net);net();
</script></body></html>
